    guide_links_title: 'Links en knoppen van de pagina'
    guide_links: 'Een klik op een link of knop leidt niet weg: hij selecteert die en bewerkt de tekst. Met {key}-klik volgt u de link, bijvoorbeeld naar een andere pagina.'
    guide_menu_title: 'Menu van een element'
    guide_menu: 'Een klik op het tabblad met het type van het geselecteerde element opent zijn menu, met alles wat u ermee kunt doen. Een rechtsklik opent het menu van de editor voor wat onder de aanwijzer ligt, ook met „Link openen”; op een touchscreen: lang indrukken. In de tekst waarin u schrijft, opent een tweede rechtsklik het menu van de browser met zijn spellingsuggesties.'
    guide_panel_title: 'Zijbalk'
    guide_panel: 'Bovenaan wisselt u tussen de weergaven (Pagina, Berichten, Modules, Talen, Controleren; afhankelijk van de licentie). In „Pagina” verplaatst u elementen door te slepen. Rechts klapt u de zijbalk in en uit. Met de punaise zet u hem naast de pagina vast; losgemaakt ligt hij over de pagina en klapt hij vanzelf in.'
    guide_languages_title: 'Vertalen'
    guide_languages: 'In het menu van een element vertaalt „Vertaalvenster openen” het tussen de talen van de pagina. Bovenaan kiest u uit welke en naar welke taal; ⇄ wisselt ze om. Op een taalversie is eerst de hoofdtaal het doel, op de hoofdtaal een taalversie. De weergave „Talen” toont de hoofdtaal naast een taalversie, met de stand van elke vertaling.'
    guide_keys_title: 'Toetsenbord'
    guide_keys: 'Tab selecteert de delen van de pagina na elkaar, elk gevolgd door zijn tabblad; Enter, spatie of een pijltoets op het tabblad opent zijn menu, de menutoets of Shift+F10 het contextmenu. Op het geselecteerde element bewerkt Enter, verplaatst Alt+pijltoets, verwijdert Delete. {key}+S slaat op, Esc beëindigt het bewerken.'

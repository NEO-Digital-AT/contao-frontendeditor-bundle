    guide_links_title: 'Liens et boutons de la page'
    guide_links: 'Un clic sur un lien ou un bouton ne quitte pas la page : il le sélectionne et modifie son texte. Avec {key}+clic, vous suivez le lien, par exemple vers une autre page.'
    guide_menu_title: 'Menu d’un élément'
    guide_menu: 'Un clic sur l’onglet portant le type de l’élément sélectionné ouvre son menu, avec tout ce que vous pouvez en faire. Un clic droit ouvre le menu de l’éditeur pour ce qui se trouve sous le pointeur, y compris « Ouvrir le lien » ; sur écran tactile : appui long. Dans le texte que vous écrivez, un second clic droit ouvre le menu du navigateur avec ses suggestions orthographiques.'
    guide_panel_title: 'Barre latérale'
    guide_panel: 'En haut, vous passez d’une vue à l’autre (Page, Publications, Modules, Langues, Vérifier ; selon la licence). Dans « Page », vous déplacez les éléments en les faisant glisser. À droite, vous repliez et dépliez la barre latérale. L’épingle la fixe à côté de la page ; détachée, elle se place sur la page et se replie d’elle-même.'
    guide_languages_title: 'Traduire'
    guide_languages: 'Dans le menu d’un élément, « Ouvrir la fenêtre de traduction » le traduit entre les langues de la page. En haut, vous choisissez la langue source et la langue cible ; ⇄ les inverse. Sur une version linguistique, la cible est d’abord la langue principale ; sur la langue principale, une version. La vue « Langues » affiche la langue principale à côté d’une version, avec l’état de chaque traduction.'
    guide_keys_title: 'Clavier'
    guide_keys: 'Tab sélectionne les parties de la page l’une après l’autre, chacune suivie de son onglet ; Entrée, Espace ou une flèche sur l’onglet ouvre son menu, la touche menu ou Maj+F10 le menu contextuel. Sur l’élément sélectionné, Entrée modifie, Alt+flèche déplace, Suppr supprime. {key}+S enregistre, Échap termine la modification.'

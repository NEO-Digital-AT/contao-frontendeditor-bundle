    guide_menu: 'A click on the tab with the type of the selected element opens its menu, with everything you can do with it. A right click opens the editor’s menu of what is under the pointer, also with “Open link”; on a touch screen: press and hold. In the text you are writing in, a second right click opens the browser’s menu with its spelling suggestions.'

    guide_hint: 'Neu im Editor? Die Kurzanleitung zeigt, wie Sie auswählen, bearbeiten und zu anderen Seiten wechseln.'
    guide_open: 'Kurzanleitung öffnen'
    guide_select_title: 'Auswählen und bearbeiten'
    guide_select: 'Ein Klick wählt ein Element aus. Ein weiterer Klick auf einen Text bearbeitet ihn direkt auf der Seite. Gespeichert wird unten in der Seitenleiste mit „Speichern“.'
    guide_links_title: 'Links und Knöpfe der Seite'
    guide_links: 'Ein Klick auf einen Link oder Knopf führt nicht weg: Er wählt ihn aus und bearbeitet seinen Text. Mit {key}-Klick folgen Sie dem Link, zum Beispiel zu einer anderen Seite.'
    guide_menu_title: 'Menü eines Elements'
    guide_menu: 'Ein Klick auf den Reiter mit dem Typ des gewählten Elements öffnet sein Menü, mit allem, was Sie damit tun können. Ein Rechtsklick öffnet das Menü des Editors für das, was unter dem Zeiger liegt, auch mit „Link öffnen“; auf dem Touchscreen: lange drücken. Im Text, in dem Sie schreiben, öffnet ein zweiter Rechtsklick das Menü des Browsers mit seinen Rechtschreibvorschlägen.'
    guide_panel_title: 'Seitenleiste'
    guide_panel: 'Oben wechseln Sie zwischen den Ansichten (Seite, Beiträge, Module, Sprachen, Prüfen; je nach Lizenz). In „Seite“ verschieben Sie Elemente durch Ziehen. Rechts klappen Sie die Seitenleiste ein und aus. Die Nadel heftet sie neben die Seite; gelöst legt sie sich über die Seite und klappt von selbst ein.'
    guide_languages_title: 'Übersetzen'
    guide_languages: 'Im Menü eines Elements übersetzt „Übersetzungsfenster öffnen“ es zwischen den Sprachen der Seite. Oben wählen Sie, aus welcher und in welche Sprache; ⇄ tauscht beide. Auf einer Sprachversion ist zunächst die Hauptsprache das Ziel, auf der Hauptsprache eine Sprachversion. Die Ansicht „Sprachen“ zeigt die Hauptsprache neben einer Sprachversion, mit dem Stand jeder Übersetzung.'
    guide_keys_title: 'Tastatur'
    guide_keys: 'Tab wählt die Teile der Seite der Reihe nach, nach jedem seinen Reiter; Enter, Leertaste oder eine Pfeiltaste auf dem Reiter öffnet sein Menü, die Menütaste oder Umschalt+F10 das Kontextmenü. Auf dem gewählten Element bearbeitet Enter, Alt+Pfeiltaste verschiebt, Entf löscht. {key}+S speichert, Esc beendet das Bearbeiten.'

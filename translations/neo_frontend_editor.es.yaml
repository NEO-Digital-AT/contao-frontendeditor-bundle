    guide_links_title: 'Enlaces y botones de la página'
    guide_links: 'Un clic en un enlace o botón no le lleva a otro sitio: lo selecciona y edita su texto. Con {key}+clic sigue el enlace, por ejemplo a otra página.'
    guide_menu_title: 'Menú de un elemento'
    guide_menu: 'Un clic en la pestaña con el tipo del elemento seleccionado abre su menú, con todo lo que puede hacer con él. Un clic derecho abre el menú del editor de lo que está bajo el puntero, también con «Abrir enlace»; en pantalla táctil: mantenga pulsado. En el texto que está escribiendo, un segundo clic derecho abre el menú del navegador con sus sugerencias ortográficas.'
    guide_panel_title: 'Barra lateral'
    guide_panel: 'Arriba cambia entre las vistas (Página, Publicaciones, Módulos, Idiomas, Revisar; según la licencia). En «Página» mueve los elementos arrastrándolos. A la derecha contrae y expande la barra lateral. El alfiler la fija junto a la página; sin fijar, se coloca sobre la página y se contrae sola.'
    guide_languages_title: 'Traducir'
    guide_languages: 'En el menú de un elemento, «Abrir la ventana de traducción» lo traduce entre los idiomas de la página. Arriba elige de qué idioma y a cuál; ⇄ los intercambia. En una versión de idioma el destino es primero el idioma principal; en el idioma principal, una versión. La vista «Idiomas» muestra el idioma principal junto a una versión, con el estado de cada traducción.'
    guide_keys_title: 'Teclado'
    guide_keys: 'Tab selecciona las partes de la página una tras otra, cada una seguida de su pestaña; Intro, la barra espaciadora o una flecha en la pestaña abre su menú, la tecla de menú o Mayús+F10 el menú contextual. En el elemento seleccionado, Intro edita, Alt+flecha mueve, Supr elimina. {key}+S guarda, Esc termina la edición.'

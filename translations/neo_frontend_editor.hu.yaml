    guide_menu_title: 'Egy elem menüje'
    guide_menu: 'A kijelölt elem típusát mutató fülre kattintva megnyílik a menüje mindazzal, amit tehet vele. Jobb kattintás megnyitja a szerkesztő menüjét a mutató alatti részhez, a „Hivatkozás megnyitása” is köztük; érintőképernyőn: hosszan nyomja meg. Az éppen írt szövegben egy második jobb kattintás megnyitja a böngésző menüjét a helyesírási javaslataival.'
    guide_panel_title: 'Oldalsáv'
    guide_panel: 'Fent vált a nézetek között (Oldal, Bejegyzések, Modulok, Nyelvek, Ellenőrzés; a licenctől függően). Az „Oldal” nézetben húzással mozgatja az elemeket. Jobb oldalt összecsukja és kinyitja az oldalsávot. A tű az oldal mellé rögzíti; rögzítés nélkül az oldal fölé kerül, és magától összecsukódik.'
    guide_languages_title: 'Fordítás'
    guide_languages: 'Egy elem menüjében a „Fordítási ablak megnyitása” lefordítja az elemet az oldal nyelvei között. Felül választja ki, melyik nyelvről melyikre; a ⇄ felcseréli őket. Nyelvi változaton először a fő nyelv a cél, a fő nyelven egy nyelvi változat. A „Nyelvek” nézet a fő nyelvet egy nyelvi változat mellett mutatja, minden fordítás állapotával.'
    guide_keys_title: 'Billentyűzet'
    guide_keys: 'A Tab sorban kijelöli az oldal részeit, mindegyik után a fülét; a fülön az Enter, a szóköz vagy egy nyíl megnyitja a menüjét, a menübillentyű vagy a Shift+F10 a helyi menüt. A kijelölt elemen az Enter szerkeszt, az Alt+nyíl mozgat, a Delete töröl. {key}+S ment, az Esc befejezi a szerkesztést.'

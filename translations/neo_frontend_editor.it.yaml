    guide_title: 'Come lavorare nell’editor'
    guide_hint: 'Nuovo nell’editor? La guida rapida mostra come selezionare, modificare e passare ad altre pagine.'
    guide_open: 'Apri la guida rapida'
    guide_select_title: 'Selezionare e modificare'
    guide_select: 'Un clic seleziona un elemento. Un altro clic su un testo lo modifica direttamente nella pagina. Si salva in fondo alla barra laterale con «Salva».'
    guide_links_title: 'Link e pulsanti della pagina'
    guide_links: 'Un clic su un link o un pulsante non porta altrove: lo seleziona e ne modifica il testo. Con {key}+clic seguite il link, ad esempio verso un’altra pagina.'
    guide_menu_title: 'Menu di un elemento'
    guide_menu: 'Un clic sulla scheda con il tipo dell’elemento selezionato apre il suo menu, con tutto ciò che potete farne. Un clic destro apre il menu dell’editor per ciò che si trova sotto il puntatore, anche con «Apri link»; su touchscreen: tenete premuto. Nel testo che state scrivendo, un secondo clic destro apre il menu del browser con i suoi suggerimenti ortografici.'
    guide_panel_title: 'Barra laterale'
    guide_panel: 'In alto passate da una vista all’altra (Pagina, Contenuti, Moduli, Lingue, Verifica; secondo la licenza). In «Pagina» spostate gli elementi trascinandoli. A destra comprimete ed espandete la barra laterale. La puntina la fissa accanto alla pagina; sganciata, si sovrappone alla pagina e si comprime da sola.'
    guide_languages_title: 'Tradurre'
    guide_languages: 'Nel menu di un elemento, «Apri la finestra di traduzione» lo traduce tra le lingue della pagina. In alto scegliete da quale lingua e in quale; ⇄ le inverte. Su una versione linguistica la destinazione è prima la lingua principale, sulla lingua principale una versione. La vista «Lingue» mostra la lingua principale accanto a una versione, con lo stato di ogni traduzione.'
    guide_keys_title: 'Tastiera'
    guide_keys: 'Tab seleziona le parti della pagina una dopo l’altra, ciascuna seguita dalla sua scheda; Invio, la barra spaziatrice o una freccia sulla scheda apre il suo menu, il tasto menu o Maiusc+F10 il menu contestuale. Sull’elemento selezionato Invio modifica, Alt+freccia sposta, Canc elimina. {key}+S salva, Esc termina la modifica.'
